<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 에이전트 플랫폼</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- 이름, 한 줄 소개, 색은 custom/brand.json에서 온다. 배치와 모양은 이 파일과 style.css에서 바꾼다. -->
  <header>
    <h1 id="brand-name">내 에이전트 플랫폼</h1>
    <p id="brand-tagline"></p>
  </header>

  <main>
    <aside>
      <section>
        <div class="title-row"><h2>에이전트</h2><button id="new-agent" class="link">+ 새 에이전트</button></div>
        <ul id="agents" class="list"></ul>
        <p id="state" class="muted">연결하지 않음</p>
      </section>

      <section>
        <div class="title-row"><h2>엔진</h2><button id="reload-engines" class="link">새로 읽기</button></div>
        <ul id="engines" class="list"></ul>
        <p class="muted small">에이전트를 돌리는 부품이다. 어느 엔진으로 돌려도 같은 에이전트로 일한다</p>
      </section>

      <section>
        <h2>스킬</h2>
        <ul id="skills" class="list"></ul>
        <p class="muted small"><code>workspace/skills/</code>에 폴더를 더하면 스킬이 늘어난다</p>
      </section>

      <section>
        <div class="title-row"><h2>일</h2><button id="reload-tasks" class="link">새로 읽기</button></div>
        <ul id="tasks" class="list"></ul>
        <p class="muted small"><code>tasks/</code>에 파일을 더하면 일이 늘어난다</p>
      </section>

      <section>
        <div class="title-row"><h2>결과함</h2><button id="reload-outbox" class="link">새로 읽기</button></div>
        <ul id="outbox" class="list"></ul>
      </section>
    </aside>

    <section id="chat">
      <div id="log"></div>
      <form id="composer">
        <textarea id="text" rows="2" placeholder="에이전트에게 맡길 일을 적는다. Enter로 보내고, Shift+Enter로 줄을 바꾼다."></textarea>
        <div class="composer-buttons">
          <button type="submit">보내기</button>
          <button type="button" id="fresh" class="ghost" title="이 에이전트의 앞의 대화를 지우고 새 세션으로 다시 연결한다">새 대화</button>
        </div>
      </form>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
